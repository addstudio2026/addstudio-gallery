<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Reference Archive</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,450;0,9..144,600;1,9..144,450&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0B0D;
    --surface:#151417;
    --surface-2:#1C1B1F;
    --line:#2A282E;
    --ink:#F2EFE9;
    --ink-dim:#9C98A0;
    --ink-faint:#6A6770;
    --gold:#C6A568;
    --gold-bright:#DEC28E;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:contain;
  }
  .font-display{font-family:'Fraunces',serif;}
  .font-mono{font-family:'IBM Plex Mono',monospace;}

  /* header */
  .header{
    position:sticky; top:0; z-index:30;
    background:linear-gradient(180deg, var(--bg) 70%, rgba(11,11,13,0));
    backdrop-filter:blur(6px);
    padding:14px 16px 10px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px; letter-spacing:.18em; text-transform:uppercase;
    color:var(--gold); opacity:.85;
  }
  .title{
    font-family:'Fraunces',serif; font-weight:450; font-style:italic;
    font-size:26px; letter-spacing:-.01em; margin:2px 0 12px;
  }
  .search-wrap{
    display:flex; align-items:center; gap:8px;
    background:var(--surface); border:1px solid var(--line);
    border-radius:11px; padding:10px 12px;
  }
  .search-wrap input{
    background:transparent; border:none; outline:none; color:var(--ink);
    font-family:'Inter',sans-serif; font-size:14.5px; width:100%;
  }
  .search-wrap input::placeholder{color:var(--ink-faint);}
  .search-icon{color:var(--ink-faint); flex:none;}

  /* chips */
  .chip-row{
    display:flex; gap:8px; overflow-x:auto; padding:12px 16px 6px;
    scrollbar-width:none;
  }
  .chip-row::-webkit-scrollbar{display:none;}
  .chip{
    flex:none; font-family:'IBM Plex Mono',monospace; font-size:11.5px;
    letter-spacing:.04em; text-transform:uppercase;
    padding:7px 13px; border-radius:999px; border:1px solid var(--line);
    color:var(--ink-dim); background:var(--surface);
    transition:all .15s ease; cursor:pointer; white-space:nowrap;
  }
  .chip.active{
    background:var(--gold); border-color:var(--gold); color:#171208;
    font-weight:500;
  }
  .chip-sep{flex:none; width:1px; background:var(--line); margin:2px 2px;}

  /* grid */
  .grid-wrap{padding:14px 12px 90px;}
  .masonry{column-count:2; column-gap:10px;}
  @media (min-width:480px){ .masonry{column-count:3;} }

  .plate{
    break-inside:avoid; margin-bottom:10px; position:relative;
    border-radius:10px; overflow:hidden; background:var(--surface);
    border:1px solid var(--line);
    cursor:pointer;
  }
  .plate img{
    width:100%; display:block; opacity:0; transition:opacity .5s ease;
  }
  .plate img.loaded{opacity:1;}
  .skel{
    position:absolute; inset:0;
    background:linear-gradient(100deg, var(--surface) 30%, var(--surface-2) 50%, var(--surface) 70%);
    background-size:200% 100%;
    animation:shimmer 1.4s ease-in-out infinite;
  }
  @keyframes shimmer{
    0%{background-position:200% 0;}
    100%{background-position:-200% 0;}
  }
  .plate-tag{
    position:absolute; left:8px; bottom:8px; right:8px;
    display:flex; align-items:flex-end; justify-content:space-between;
    pointer-events:none;
  }
  .plate-shade{
    position:absolute; inset:0; top:55%;
    background:linear-gradient(180deg, rgba(11,11,13,0), rgba(11,11,13,.88));
    pointer-events:none;
  }
  .plate-id{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--gold-bright);
    letter-spacing:.03em; z-index:2;
  }
  .plate-brand{
    font-family:'Inter',sans-serif; font-size:10.5px; color:var(--ink-dim);
    letter-spacing:.03em; z-index:2; text-align:right;
  }

  /* empty state */
  .empty{
    text-align:center; padding:60px 20px; color:var(--ink-faint);
  }
  .empty .font-display{color:var(--ink-dim); font-size:19px; margin-bottom:6px;}

  /* modal */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(8,8,9,.86);
    backdrop-filter:blur(4px);
    z-index:50; display:flex; align-items:flex-end;
    opacity:0; pointer-events:none; transition:opacity .25s ease;
  }
  .modal-backdrop.open{opacity:1; pointer-events:auto;}
  .modal-sheet{
    width:100%; max-height:92vh; overflow-y:auto;
    background:var(--bg); border-radius:20px 20px 0 0;
    border-top:1px solid var(--line);
    transform:translateY(24px); transition:transform .3s cubic-bezier(.2,.8,.2,1);
  }
  .modal-backdrop.open .modal-sheet{transform:translateY(0);}
  .modal-handle{
    width:36px; height:4px; background:var(--line); border-radius:99px;
    margin:10px auto 4px;
  }
  .modal-img-wrap{
    padding:14px 14px 0; position:relative;
  }
  .modal-img-wrap img{
    width:100%; border-radius:12px; display:block; background:var(--surface);
  }
  .modal-close{
    position:absolute; top:24px; right:24px; z-index:2;
    width:32px; height:32px; border-radius:99px;
    background:rgba(11,11,13,.6); border:1px solid rgba(255,255,255,.15);
    color:var(--ink); display:flex; align-items:center; justify-content:center;
    backdrop-filter:blur(4px);
  }
  .modal-body{padding:18px 20px 24px;}
  .modal-plate-num{
    font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--gold);
    letter-spacing:.1em; text-transform:uppercase; margin-bottom:4px;
  }
  .modal-title{
    font-family:'Fraunces',serif; font-style:italic; font-weight:450;
    font-size:24px; margin:0 0 14px; letter-spacing:-.01em;
  }
  .modal-meta{
    display:flex; gap:22px; padding:14px 0; border-top:1px solid var(--line);
    border-bottom:1px solid var(--line); margin-bottom:20px;
  }
  .meta-item .meta-label{
    font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--ink-faint); margin-bottom:4px;
  }
  .meta-item .meta-value{font-size:14px; color:var(--ink);}
  .select-btn{
    width:100%; padding:15px; border-radius:12px; border:none;
    background:var(--gold); color:#171208; font-family:'Inter',sans-serif;
    font-weight:600; font-size:15px; letter-spacing:.01em;
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition:filter .15s ease;
  }
  .select-btn:active{filter:brightness(.92);}

  /* loading skeleton grid on first paint */
  .init-skel{
    break-inside:avoid; margin-bottom:10px; border-radius:10px;
    background:var(--surface); position:relative; overflow:hidden;
  }
</style>
</head>
<body>

<div class="header">
  <div class="eyebrow">Reference Archive · Product Photography</div>
  <div class="title">Select a Reference</div>
  <div class="search-wrap">
    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="searchInput" type="text" placeholder="Search by ID or brand…" autocomplete="off">
  </div>
</div>

<div class="chip-row" id="chipRow"></div>

<div class="grid-wrap">
  <div class="masonry" id="grid"></div>
  <div class="empty" id="emptyState" style="display:none;">
    <div class="font-display">No plates match</div>
    <div>Try a different search or filter.</div>
  </div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal-sheet" id="modalSheet">
    <div class="modal-handle"></div>
    <div class="modal-img-wrap">
      <button class="modal-close" id="modalClose">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <img id="modalImg" src="" alt="">
    </div>
    <div class="modal-body">
      <div class="modal-plate-num" id="modalPlateNum">R000</div>
      <h2 class="modal-title" id="modalStyle">—</h2>
      <div class="modal-meta">
        <div class="meta-item">
          <div class="meta-label">Brand</div>
          <div class="meta-value" id="modalBrand">—</div>
        </div>
        <div class="meta-item">
          <div class="meta-label">Category</div>
          <div class="meta-value" id="modalCategory">—</div>
        </div>
      </div>
      <button class="select-btn" id="selectBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg>
        Select this Reference
      </button>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';

  // ---- Telegram init ----
  var tg = window.Telegram ? window.Telegram.WebApp : null;
  if (tg) {
    tg.ready();
    tg.expand();
    try { tg.setHeaderColor('#0B0B0D'); tg.setBackgroundColor('#0B0B0D'); } catch(e){}
  }

  var state = { data: [], activeFilter: 'ALL', query: '' };

  var gridEl = document.getElementById('grid');
  var chipRowEl = document.getElementById('chipRow');
  var emptyEl = document.getElementById('emptyState');
  var searchInput = document.getElementById('searchInput');

  // ---- initial skeleton while manifest loads ----
  function renderInitSkeletons(){
    var heights = [180,140,210,160,190,150];
    var html = '';
    for (var i=0;i<9;i++){
      html += '<div class="init-skel" style="height:'+heights[i%heights.length]+'px;"><div class="skel"></div></div>';
    }
    gridEl.innerHTML = html;
  }
  renderInitSkeletons();

  fetch('manifest.json')
    .then(function(r){ return r.json(); })
    .then(function(json){
      state.data = json;
      buildChips(json);
      renderGrid();
    })
    .catch(function(err){
      gridEl.innerHTML = '<div class="empty" style="grid-column:1/-1;">' +
        '<div class="font-display">Could not load manifest.json</div>' +
        '<div>Serve this folder over HTTP (not file://) so fetch() can reach it.</div></div>';
      console.error(err);
    });

  function buildChips(data){
    var categories = uniq(data.map(function(d){ return d.category; }));
    var brands = uniq(data.map(function(d){ return d.brand; }));

    var chips = ['ALL'].concat(categories);
    var html = chips.map(function(c){
      return '<div class="chip'+(c==='ALL'?' active':'')+'" data-type="category" data-value="'+esc(c)+'">'+esc(c)+'</div>';
    }).join('');

    html += '<div class="chip-sep"></div>';
    html += brands.map(function(b){
      return '<div class="chip" data-type="brand" data-value="'+esc(b)+'">'+esc(b)+'</div>';
    }).join('');

    chipRowEl.innerHTML = html;

    chipRowEl.querySelectorAll('.chip').forEach(function(chip){
      chip.addEventListener('click', function(){
        var value = chip.getAttribute('data-value');
        chipRowEl.querySelectorAll('.chip').forEach(function(c){ c.classList.remove('active'); });
        chip.classList.add('active');
        state.activeFilter = value;
        renderGrid();
      });
    });
  }

  function uniq(arr){
    return arr.filter(function(v,i){ return arr.indexOf(v) === i; });
  }
  function esc(s){
    var d = document.createElement('div'); d.textContent = s; return d.innerHTML;
  }

  function filteredData(){
    var q = state.query.trim().toLowerCase();
    return state.data.filter(function(item){
      var matchesFilter = state.activeFilter === 'ALL' ||
        item.category === state.activeFilter || item.brand === state.activeFilter;
      var matchesQuery = !q ||
        item.id.toLowerCase().indexOf(q) !== -1 ||
        item.brand.toLowerCase().indexOf(q) !== -1;
      return matchesFilter && matchesQuery;
    });
  }

  function renderGrid(){
    var items = filteredData();
    if (items.length === 0){
      gridEl.innerHTML = '';
      emptyEl.style.display = 'block';
      return;
    }
    emptyEl.style.display = 'none';

    gridEl.innerHTML = items.map(function(item){
      return (
        '<div class="plate" data-id="'+esc(item.id)+'">' +
          '<div class="skel"></div>' +
          '<img data-src="'+esc(item.url)+'" alt="'+esc(item.id)+'">' +
          '<div class="plate-shade"></div>' +
          '<div class="plate-tag">' +
            '<span class="plate-id">'+esc(item.id)+'</span>' +
            '<span class="plate-brand">'+esc(item.brand)+'</span>' +
          '</div>' +
        '</div>'
      );
    }).join('');

    lazyLoadImages();

    gridEl.querySelectorAll('.plate').forEach(function(plate){
      plate.addEventListener('click', function(){
        var id = plate.getAttribute('data-id');
        var item = state.data.find(function(d){ return d.id === id; });
        if (item) openModal(item);
      });
    });
  }

  // ---- lazy loading via IntersectionObserver ----
  function lazyLoadImages(){
    var imgs = gridEl.querySelectorAll('img[data-src]');
    if ('IntersectionObserver' in window){
      var io = new IntersectionObserver(function(entries, obs){
        entries.forEach(function(entry){
          if (entry.isIntersecting){
            loadImg(entry.target);
            obs.unobserve(entry.target);
          }
        });
      }, { rootMargin: '150px 0px' });
      imgs.forEach(function(img){ io.observe(img); });
    } else {
      imgs.forEach(loadImg);
    }
  }
  function loadImg(img){
    img.src = img.getAttribute('data-src');
    img.loading = 'lazy';
    img.addEventListener('load', function(){
      img.classList.add('loaded');
      var skel = img.previousElementSibling;
      if (skel && skel.classList.contains('skel')) skel.remove();
    });
  }

  // ---- search ----
  var searchDebounce;
  searchInput.addEventListener('input', function(e){
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(function(){
      state.query = e.target.value;
      renderGrid();
    }, 120);
  });

  // ---- modal ----
  var modalBackdrop = document.getElementById('modalBackdrop');
  var modalImg = document.getElementById('modalImg');
  var modalPlateNum = document.getElementById('modalPlateNum');
  var modalStyle = document.getElementById('modalStyle');
  var modalBrand = document.getElementById('modalBrand');
  var modalCategory = document.getElementById('modalCategory');
  var selectBtn = document.getElementById('selectBtn');
  var currentItem = null;

  function openModal(item){
    currentItem = item;
    modalImg.src = item.url;
    modalPlateNum.textContent = item.id;
    modalStyle.textContent = item.style;
    modalBrand.textContent = item.brand;
    modalCategory.textContent = item.category;
    modalBackdrop.classList.add('open');
    document.body.style.overflow = 'hidden';
    if (tg && tg.BackButton){
      tg.BackButton.show();
      tg.BackButton.onClick(closeModal);
    }
  }
  function closeModal(){
    modalBackdrop.classList.remove('open');
    document.body.style.overflow = '';
    currentItem = null;
    if (tg && tg.BackButton){
      tg.BackButton.hide();
      tg.BackButton.offClick(closeModal);
    }
  }
  document.getElementById('modalClose').addEventListener('click', closeModal);
  modalBackdrop.addEventListener('click', function(e){
    if (e.target === modalBackdrop) closeModal();
  });

  selectBtn.addEventListener('click', function(){
    if (!currentItem) return;
    if (tg && tg.sendData){
      tg.sendData(currentItem.id);
      tg.close();
    } else {
      // fallback for testing outside Telegram
      alert('Selected reference: ' + currentItem.id +
        '\n\n(Telegram.WebApp.sendData is only available inside Telegram — this alert is a browser-preview fallback.)');
    }
  });

  if (tg && tg.MainButton) { tg.MainButton.hide(); }
})();
</script>
</body>
</html>
