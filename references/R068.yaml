style_mood:
  render_style: photoreal_3d_visualization_studio_hybrid
  post_processing: clean_editorial_high_key_slight_green_grade_lifted_blacks
  mood: [clinical, fresh, scientific, pure, botanical]
  season_occasion: year_round_derma_science_campaign

reuse_retrieval:
  concept_idea: >
    A dermatological cleanser is presented as a laboratory specimen — elevated on a
    polished chrome plinth inside a bright glassware lab where chlorophyll-green
    solutions bokeh around it, framing efficacy as proven science.
  fits_product_types:
    - acne_serums
    - ampoules
    - clinical_toners
    - derma_moisturizers
    - scalp_tonics
    - vitamin_c_boosters
  fits_container:
    - squeeze_tube
    - dropper_bottle
    - slim_cylindrical_bottle
    - airless_pump
    - small_jar_on_pedestal
  swap_difficulty: medium
  strength: "Foreground glassware bokeh frame + chrome pedestal creating a credible lab-science stage without clutter"
  avoid_if: >
    Product is warm-toned, indulgent/luxury-fragrance, natural-organic-rustic, or
    requires texture-swatch storytelling; green cast will contaminate neutral packaging.

prompt_seed:
  prompt_seed: >
    Photoreal studio product visualization of the product standing upright and perfectly
    centered on a polished chrome mirror cube pedestal inside a bright, high-key laboratory
    set, camera at eye level with a marginal 5-degree upward tilt, product occupying roughly
    38 percent of the frame height in a 2:3 vertical crop. The environment is a seamless
    radial gradient of pale lab white-green (#EAF3EA) brightening behind the product and
    falling to cool green-grey at the corners. Surround the hero with scientific glassware:
    two large erlenmeyer flasks filled with vivid chlorophyll-green liquid (#43B03B) sitting
    heavily out of focus in the lower-left and lower-right foreground to form a bokeh frame,
    two slim test tubes of green solution in a chrome wire rack at mid-right just behind the
    product plane, a tall graduated measuring cylinder with printed scale numerals cropped at
    upper right, and an angled glass pipette entering the frame from the top left at minus
    35 degrees, all softly defocused. Lighting is soft diffused studio from a large source at
    upper-front-left, roughly 40 degrees elevation and 25 degrees azimuth, at 5600K, with a
    high 1:1.5 fill ratio from broad white bounce, cool white rim light tracing the right
    contour of the product and a crisp specular strip down the vertical chrome edge of the
    pedestal, and only a short soft contact shadow beneath the product with a soft mirrored
    underside reflection on the chrome top face. Depth of field is shallow-to-medium at an
    f/2.8 equivalent, with the product label razor sharp and all glassware rendered in creamy
    refractive bokeh. Palette is restrained cool neutral: brushed silver, pale mint white,
    soft leaf green and deep botanical green on the product against selective vivid green
    accents in the liquids. Keep the upper third as clean negative space for headline copy.
    Post-processing is clean editorial with lifted blacks, a subtle green grade, medium
    contrast and no heavy vignette. Mood: clinical, fresh, scientific, pure, botanical.
  negative_prompt: >
    warm tungsten cast, orange or amber tones, harsh direct sun, hard-edged black shadows,
    dark or moody background, wooden or stone surfaces, fabric drapery, flowers, leaves,
    water splashes, cream swatches, glitter or particles, human hands or skin, cluttered
    props, multiple duplicate products, tilted dutch angle, heavy vignette, film grain,
    lens flare, text overlays or graphic badges added to the background, low resolution,
    plastic-looking CGI artifacts, distorted or unreadable label typography, fisheye
    distortion, oversaturated neon, HDR halos.
