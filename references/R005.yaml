label_style: minimal_white_typographic

# --- 2. COLOR ---
palette_product: ["#C68A4B amber glass", "#E8C86A golden serum", "#FFFFFF white label"]
palette_scene: ["#F3E6C8 warm cream", "#D4A050 golden yellow"]
color_temperature: warm
contrast: low
saturation: medium
