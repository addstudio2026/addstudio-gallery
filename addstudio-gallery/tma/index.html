<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADDSTUDIO Gallery v3.2</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg: #0B0B0D; --surface: #151417; --line: #2A282E; --ink: #F2EFE9; --gold: #C6A568; }
  body { background: var(--bg); color: var(--ink); font-family: sans-serif; margin: 0; padding: 0; }
  .header { padding: 20px 16px; background: var(--bg); position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--line); }
  .title { font-size: 22px; font-weight: bold; margin-bottom: 15px; color: var(--gold); }
  .search-box { width: 100%; padding: 12px; background: var(--surface); border: 1px solid var(--line); color: white; border-radius: 8px; box-sizing: border-box; margin-bottom: 15px; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; }
  .chip { padding: 6px 12px; background: var(--surface); border: 1px solid var(--line); color: #9C98A0; border-radius: 20px; cursor: pointer; font-size: 12px; }
  .chip.active { background: var(--gold); color: black; border-color: var(--gold); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; padding: 16px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
  .card img { width: 100%; height: auto; display: block; }
  .card-info { padding: 10px; }
  .card-id { font-size: 12px; color: var(--gold); font-weight: bold; }
  .card-brand { font-size: 10px; color: #9C98A0; margin-bottom: 8px; }
  .btn-group { display: flex; gap: 5px; }
  .btn { flex: 1; padding: 6px; font-size: 10px; border-radius: 6px; cursor: pointer; text-align: center; text-decoration: none; border: 1px solid var(--line); background: var(--surface); color: white; }
  .btn-primary { background: var(--gold); color: black; border-color: var(--gold); }
</style>
</head>
<body onload="init()">
  <div class="header">
    <div class="title">Reference Gallery</div>
    <input type="text" id="search" class="search-box" placeholder="Search ID or Brand..." oninput="renderGrid()">
    <div class="filters" id="filters"></div>
  </div>
  <div class="grid" id="grid"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    let allData = [];
    let activeFilter = 'ALL';

    async function init() {
      try {
        const res = await fetch('manifest_v3.json');
        allData = await res.json();
        renderFilters();
        renderGrid();
      } catch (e) { console.error('Load error', e); }
    }

    function renderFilters() {
      const styles = ['ALL', ...new Set(allData.map(item => item.style))].sort();
      const container = document.getElementById('filters');
      container.innerHTML = styles.map(s => `<div class="chip ${s==='ALL'?'active':''}" onclick="setFilter('${s.replace(/'/g, "\\'")}', this)">${s}</div>`).join('');
    }

    window.setFilter = (val, el) => {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      activeFilter = val;
      renderGrid();
    };

    function renderGrid() {
      const query = document.getElementById('search').value.toLowerCase();
      const filtered = allData.filter(item => {
        const matchesQuery = !query || item.id.toLowerCase().includes(query) || item.brand.toLowerCase().includes(query);
        const matchesStyle = activeFilter === 'ALL' || item.style === activeFilter;
        return matchesQuery && matchesStyle;
      });

      const grid = document.getElementById('grid');
      grid.innerHTML = filtered.map(item => `
        <div class="card">
          <img src="${item.url}">
          <div class="card-info">
            <div class="card-id">${item.id}</div>
            <div class="card-brand">${item.brand}</div>
            <div class="btn-group">
              <div class="btn" onclick="copyID('${item.id}')">Copy ID</div>
              <a href="https://t.me/addstudiobot?start=${item.id}" class="btn btn-primary">Send</a>
            </div>
          </div>
        </div>
      `).join('');
    }

    window.copyID = (id) => {
      navigator.clipboard.writeText(id).then(() => {
        const toast = document.createElement('div');
        toast.textContent = 'Copied!';
        toast.style = 'position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--gold); color:black; padding:10px 20px; border-radius:20px; z-index:1000;';
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 1500);
      });
    };

    document.getElementById('search').oninput = renderGrid;
    init();
  </script>
</body>
</html>
