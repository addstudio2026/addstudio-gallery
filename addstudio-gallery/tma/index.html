<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Reference Archive</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,450;0,9..144,600;1,9..144,450&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0B0D;
    --surface:#151417;
    --surface-2:#1C1B1F;
    --line:#2A282E;
    --ink:#F2EFE9;
    --ink-dim:#9C98A0;
    --ink-faint:#6A6770;
    --gold:#C6A568;
    --gold-bright:#DEC28E;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:contain;
  }
  .font-display{font-family:'Fraunces',serif;}
  .font-mono{font-family:'IBM Plex Mono',monospace;}

  .header{
    position:sticky; top:0; z-index:30;
    background:linear-gradient(180deg, var(--bg) 70%, rgba(11,11,13,0));
    backdrop-filter:blur(6px);
    padding:14px 16px 10px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px; letter-spacing:.18em; text-transform:uppercase;
    color:var(--gold); opacity:.85;
  }
  .title{
    font-family:'Fraunces',serif; font-weight:450; font-style:italic;
    font-size:26px; letter-spacing:-.01em; margin:2px 0 12px;
  }
  .search-wrap{
    display:flex; align-items:center; gap:8px;
    background:var(--surface); border:1px solid var(--line);
    border-radius:11px; padding:10px 12px;
  }
  .search-wrap input{
    background:transparent; border:none; outline:none; color:var(--ink);
    font-family:'Inter',sans-serif; font-size:14.5px; width:100%;
  }
  .search-wrap input::placeholder{color:var(--ink-faint);}
  .search-icon{color:var(--ink-faint); flex:none;}

  .chip-row{
    display:flex; gap:8px; overflow-x:auto; padding:12px 16px 6px;
    scrollbar-width:none;
  }
  .chip-row::-webkit-scrollbar{display:none;}
  .chip{
    flex:none; font-family:'IBM Plex Mono',monospace; font-size:11.5px;
    letter-spacing:.04em; text-transform:uppercase;
    padding:7px 13px; border-radius:999px; border:1px solid var(--line);
    color:var(--ink-dim); background:var(--surface);
    transition:all .15s ease; cursor:pointer; white-space:nowrap;
  }
  .chip.active{
    background:var(--gold); border-color:var(--gold); color:#17120/black;
    font-weight:500;
  }
  .chip-sep{flex:none; width:1px; background:var(--line); margin:2px 2px;}

  .grid-wrap{padding:14px 12px 90px;}
  .masonry{column-count:2; column-gap:12px;}
  @media (min-width:480px){ .masonry{column-count:3;} }

  .plate{
    break-inside:avoid; margin-bottom:16px; position:relative;
    border-radius:12px; overflow:hidden; background:var(--surface);
    border:1px solid var(--line);
  }
  .plate img{
    width:100%; display:block; opacity:0; transition:opacity .5s ease;
  }
  .plate img.loaded{opacity:1;}
  .skel{
    position:absolute; inset:0;
    background:linear-gradient(100deg, var(--surface) 30%, var(--surface-2) 50%, var(--surface) 70%);
    background-size:200% 100%;
    animation:shimmer 1.4s ease-in-out infinite;
  }
  @keyframes shimmer{
    0%{background-position:200% 0;}
    100%{background-position:-100% 0;}
  }
  .plate-info{
    padding:10px; display:flex; flex-direction:column; gap:6px;
  }
  .plate-id{
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--gold-bright);
    letter-spacing:.05em;
  }
  .plate-brand{
    font-family:'Inter',sans-serif; font-size:11px; color:var(--ink-dim);
    margin-bottom:8px;
  }
  .copy-btn{
    width:100%; padding:8px; border-radius:8px; border:1px solid var(--line);
    background:var(--surface-2); color:var(--ink); font-family:'Inter',sans-serif;
    font-size:12px; font-weight:500; cursor:pointer;
    transition:all .2s ease; display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .copy-btn:active{background:var(--line); scale:0.98;}
  .copy-btn.copied{
    background:var(--gold); color:#000; border-color:var(--gold);
  }

  .empty{
    text-align:center; padding:60px 20px; color:var(--ink-faint);
  }
  .empty .font-display{color:var(--ink-dim); font-size:19px; margin-bottom:6px;}
</style>
</head>
<body>

<div class="header">
  <div class="eyebrow">Reference Archive · Product Photography</div>
  <div class="title">Select a Reference</div>
  <div class="search-wrap">
    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="searchInput" type="text" placeholder="Search by ID or brand…" autocomplete="off">
  </div>
</div>

<div class="chip-row" id="chipRow"></div>

<div class="grid-wrap">
  <div class="masonry" id="grid"></div>
  <div class="empty" id="emptyState" style="display:none;">
    <div class="font-display">No plates match</div>
    <div>Try a different search or filter.</div>
  </div>
</div>

<script>
(function(){
  'use strict';

  var tg = window.Telegram ? window.Telegram.WebApp : null;
  if (tg) {
    tg.ready();
    tg.expand();
    try { tg.setHeaderColor('#0B0B0D'); tg.setBackgroundColor('#0B0B0D'); } catch(e){}
  }

  var state = { data: [], activeFilter: 'ALL', query: '' };

  var gridEl = document.getElementById('grid');
  var chipRowEl = document.getElementById('chipRow');
  var emptyEl = document.getElementById('emptyState');
  var searchInput = document.getElementById('searchInput');

  function renderInitSkeletons(){
    var heights = [180,140,210,160,190,150];
    var html = '';
    for (var i=0;i<9;i++){
      html += '<div class="init-skel" style="height:'+heights[i%heights.length]+'px;"><div class="skel"></div></div>';
    }
    gridEl.innerHTML = html;
  }
  renderInitSkeletons();

  fetch('manifest.json')
    .then(function(r){ return r.json(); })
    .then(function(json){
      state.data = json;
      buildChips(json);
      renderGrid();
    })
    .catch(function(err){
      gridEl.innerHTML = '<div class="empty" style="grid-column:1/-1;">' +
        '<div class="font-display">Could not load manifest.json</div>' +
        '<div>Serve this folder over HTTP so fetch() can reach it.</div></div>';
      console.error(err);
    });

  function buildChips(data){
    var categories = uniq(data.map(function(d){ return d.category; }));
    var brands = uniq(data.map(function(d){ return d.brand; }));
    var chips = ['ALL'].concat(categories);
    var html = chips.map(function(c){
      return '<div class="chip'+(c==='ALL'?' active':'')+'" data-type="category" data-value="'+esc(c)+'">'+esc(c)+'</div>';
    }).join('');
    html += '<div class="chip-sep"></div>';
    html += brands.map(function(b){
      return '<div class="chip" data-type="brand" data-value="'+esc(b)+'">'+esc(b)+'</div>';
    }).join('');
    chipRowEl.innerHTML = html;
    chipRowEl.querySelectorAll('.chip').forEach(function(chip){
      chip.addEventListener('click', function(){
        var value = chip.getAttribute('data-value');
        chipRowEl.querySelectorAll('.chip').forEach(function(c){ c.classList.remove('active'); });
        chip.classList.add('active');
        state.activeFilter = value;
        renderGrid();
      });
    });
  }

  function uniq(arr){ return arr.filter(function(v,i){ return arr.indexOf(v) === i; }); }
  function esc(s){ var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  function filteredData(){
    var q = state.query.trim().toLowerCase();
    return state.data.filter(function(item){
      var matchesFilter = state.activeFilter === 'ALL' ||
        item.category === state.activeFilter || item.brand === state.// Updated logic
        item.brand === state.activeFilter;
      var matchesQuery = !q ||
        item.id.toLowerCase().indexOf(q) !== -1 ||
        item.brand.toLowerCase().indexOf(q) !== -1;
      return matchesFilter && matchesQuery;
    });
  }

  function renderGrid(){
    var items = filteredData();
    if (items.length === 0){
      gridEl.innerHTML = '';
      emptyEl.style.display = 'block';
      return;
    }
    emptyEl.style.display = 'none';
    gridEl.innerHTML = items.map(function(item){
      return (
        '<div class="plate">' +
          '<div class="skel"></div>' +
          '<img data-src="'+esc(item.url)+'" alt="'+esc(item.id)+'">' +
          '<div class="plate-info">' +
            '<div class="plate-id">'+esc(item.id)+'</div>' +
            '<div class="plate-brand">'+esc(item.brand)+'</div>' +
            '<button class="copy-btn" data-id="'+esc(item.id)+'">' +
              '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"\/>' +
              'Copy ID</button>' +
          '</div>' +
        '</div>'
      );
    }).join('');
    lazyLoadImages();
    // Copy events
    gridEl.querySelectorAll('.copy-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-id');
        copyToClipboard(id, btn);
      });
    });
  }

  function lazyLoadImages(){
    var imgs = gridEl.querySelectorAll('img[data-src]');
    if ('IntersectionObserver' in window){
      var io = new IntersectionObserver(function(entries, obs){
        entries.forEach(function(entry){
          if (entry.isIntersecting){
            loadImg(entry.target);
            obs.unobserve(entry.target);
          }
        });
      }, { rootMargin: '150px 0px' });
      imgs.forEach(function(img){ io.observe(img); });
    } else { imgs.forEach(loadImg); }
  }
  function loadImg(img){
    img.src = img.getAttribute('data-src');
    img.loading = 'lazy';
    img.addEventListener('load', function(){
      img.classList.add('loaded');
      var skel = img.previousElementSibling;
      if (skel && skel.classList.contains('skel')) skel.remove();
    });
  }

  var searchDebounce;
  searchInput.addEventListener('input', function(e){
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(function(){
      state.query = e.target.value;
      renderGrid();
    }, 120);
  });

  function copyToClipboard(text, btn){
    var el = document.createElement('textarea');
    el.value = text;
    document.body.appendChild(el);
    el.select();
    document.execCommand('copy');
    document.body.removeChild(el);
    
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(function(){
      btn.textContent = 'Copy ID';
      btn.classList.remove('copied');
    }, 1500);
  }

})();
</script>
</body>
</html>
